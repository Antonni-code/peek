<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Peek</title></head>
  <body>
    <main class="shell popup-shell">
      <header class="popup-head"><img src="/icons/icon-32.png" alt="" /><div><p class="eyebrow">Peek</p><h1>Stay where you are.</h1></div><span class="mini-plan" id="mini-plan">Free</span></header>
      <p>Hold <strong>Option</strong> or <strong>Alt</strong> over any link. Peek opens beside it without changing tabs.</p>
      <div class="status" role="status"><span class="status__dot" aria-hidden="true"></span><span id="status-copy">Ready on this page</span></div>
      <button class="button button--full" id="toggle-stack" type="button">Open Peek Stack</button>
      <button class="text-button" id="open-options" type="button">Settings, history, and Pro</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
